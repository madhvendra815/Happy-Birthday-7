<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Bushra 🎂</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-family:Georgia,"Times New Roman",serif;
    color:white;

    background:
        radial-gradient(circle at 50% 20%,
        #493451 0%,
        #211726 45%,
        #08060c 100%);
}

/* Background glow */
.glow{
    position:absolute;
    width:350px;
    height:350px;
    background:rgba(255,190,220,.12);
    filter:blur(80px);
    border-radius:50%;
}

/* Main card */
.card{
    position:relative;
    z-index:2;
    width:90%;
    max-width:650px;
    padding:42px 25px;

    border:1px solid rgba(255,255,255,.18);
    border-radius:32px;

    background:rgba(255,255,255,.075);
    backdrop-filter:blur(20px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        inset 0 0 30px rgba(255,255,255,.03);

    animation:cardIn 1.5s ease;
}

.emoji{
    font-size:68px;
    margin-bottom:15px;
    animation:bounce 2s infinite;
}

.small{
    font-family:Arial,sans-serif;
    font-size:12px;
    letter-spacing:4px;
    text-transform:uppercase;
    opacity:.6;
    margin-bottom:20px;
}

h1{
    font-size:clamp(42px,10vw,78px);
    font-weight:400;
    line-height:1.05;

    background:linear-gradient(
        90deg,
        #fff,
        #ffd7e8,
        #fff
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:shine 3s infinite;
}

.message{
    margin-top:25px;
    font-family:Arial,sans-serif;
    font-size:16px;
    line-height:1.8;
    opacity:.78;
}

.divider{
    width:70px;
    height:1px;
    background:rgba(255,255,255,.5);
    margin:25px auto;
}

.from{
    font-family:Arial,sans-serif;
    font-size:11px;
    letter-spacing:4px;
    opacity:.55;
}

.edited{
    margin-top:28px;
    font-size:11px;
    letter-spacing:2px;
    opacity:.45;
}

/* Music button */
.music{
    position:fixed;
    bottom:22px;
    right:22px;
    z-index:5;

    width:50px;
    height:50px;

    border:1px solid rgba(255,255,255,.25);
    border-radius:50%;

    background:rgba(255,255,255,.1);
    color:white;

    cursor:pointer;
    font-size:20px;

    backdrop-filter:blur(10px);
}

/* Floating particles */
.particle{
    position:absolute;
    bottom:-30px;
    font-size:18px;
    opacity:.7;

    animation:floatUp linear infinite;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(40px) scale(.94);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

@keyframes shine{
    0%,100%{filter:brightness(1);}
    50%{filter:brightness(1.3);}
}

@keyframes floatUp{
    from{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    15%{opacity:.7;}

    to{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="card">

    <div class="emoji">🎂</div>

    <div class="small">
        Today is your special day
    </div>

    <h1>
        Happy Birthday<br>
        Bushra ✨
    </h1>

    <div class="divider"></div>

    <div class="message">
        May your day be filled with<br>
        happiness, laughter and beautiful memories. ✨
        <br><br>
        Keep smiling and keep shining. 🌙
    </div>

    <div class="divider"></div>

    <div class="from">
        WITH BEST WISHES<br><br>
        SPRING BOY

        <div class="edited">
            Edited by Madhvendra
        </div>
    </div>

</div>

<button class="music" onclick="toggleMusic()" id="musicBtn">
    ♫
</button>

<script>
const symbols=["✦","✧","♡","✨","·"];

function createParticle(){

    const p=document.createElement("div");

    p.className="particle";

    p.innerHTML=
        symbols[Math.floor(Math.random()*symbols.length)];

    p.style.left=Math.random()*100+"vw";

    p.style.animationDuration=
        (6+Math.random()*6)+"s";

    p.style.fontSize=
        (12+Math.random()*15)+"px";

    document.body.appendChild(p);

    setTimeout(()=>{
        p.remove();
    },12000);
}

setInterval(createParticle,500);


/* Optional music */
let music;

function toggleMusic(){

    if(!music){

        music=new Audio("birthday.mp3");
        music.loop=true;

        music.play();

        document.getElementById("musicBtn").innerHTML="🔊";

    }else{

        if(music.paused){

            music.play();
            document.getElementById("musicBtn").innerHTML="🔊";

        }else{

            music.pause();
            document.getElementById("musicBtn").innerHTML="♫";
        }
    }
}
</script>

</body>
</html>
