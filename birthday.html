<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Happy Birthday Bushra 🎂</title>

<link
    rel="stylesheet"
    href="birthday.css"
>

</head><body><!-- Night sky -->
<div id="sky"></div>

<!-- Moon -->
<div class="moon">☾</div>

<!-- Main card -->
<main class="card">

    <div class="emoji">
        🎂
    </div>

    <div class="small">
        Today is your special day
    </div>

    <h1>
        Happy Birthday<br>
        Bushra ✨
    </h1>

    <div class="divider"></div>

    <div
        class="message"
        id="message"
    >
        May your day be filled with
        happiness, laughter and beautiful memories. ✨

        <br><br>

        Keep smiling and keep shining. 🌙
    </div>

    <div class="divider"></div>

    <div class="wish-box">

        <p id="wishText">
            May this year bring you
            countless beautiful moments.
        </p>

    </div>

    <button
        class="nextWish"
        id="nextWish"
    >
        Another Wish ✨
    </button>

    <div class="divider"></div>

    <div class="from">

        WITH BEST WISHES

        <br><br>

        SPRING BOY

        <div class="edited">
            Edited by Madhvendra
        </div>

    </div>

</main>


<!-- Music -->
<button
    class="music"
    id="musicBtn"
    aria-label="Play birthday music"
>
    ♫
</button>


<!-- Audio -->
<audio
    id="birthdayMusic"
    src="birthday.mp3"
    loop
    preload="auto"
></audio>


<script src="birthday.js"></script>

</body></html>
